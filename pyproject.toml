[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkfetch"
version = "0.1.0"
description = "A resumable command-line downloader for public file-hosting links"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pycryptodome>=3.20,<4"]
keywords = ["download", "resumable", "file-hosting", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
linkfetch = "linkfetch.cli:main"

[project.optional-dependencies]
browser = [
  "playwright>=1.50,<2",
  "pywebview>=6,<7; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
include = ["linkfetch*"]
